# medidores-zhongyi  (marca: el instalador solo modifica este archivo si contiene esta línea)
# VirtualHost propio de la plataforma de medidores: https://dev.minkafab.com:8450/
# deploy/instalar.sh lo copia a /etc/apache2/sites-available/medidores.conf reemplazando
# 8450, dev.minkafab.com, /var/www/medidores y las rutas del certificado. Si no hay certificado,
# quita el bloque SSL y el sitio queda en HTTP.
Listen 8450

<VirtualHost *:8450>
    ServerName dev.minkafab.com
    DocumentRoot /var/www/medidores/public

    #SSL SSLEngine on
    #SSL SSLCertificateFile    __CERT__
    #SSL SSLCertificateKeyFile __KEY__

    <Directory /var/www/medidores/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # El endpoint de ingesta solo acepta conexiones desde el propio servidor (receptores Node).
    <Location /api/ingest.php>
        Require local
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/medidores_error.log
    CustomLog ${APACHE_LOG_DIR}/medidores_access.log combined
</VirtualHost>
