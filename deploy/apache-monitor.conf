# Publica el monitor como subcarpeta del sitio existente: https://dev.minkafab.com/monitor/
# Es configuración global (conf-available), así que vale para los VirtualHost HTTP y HTTPS
# del servidor y usa el certificado que ya tenga dev.minkafab.com.
# Instalar (deploy/instalar.sh lo hace solo; ajustar /monitor y /var/www/monitor si cambian):
#   sudo cp deploy/apache-monitor.conf /etc/apache2/conf-available/monitor.conf
#   sudo a2enmod alias headers && sudo a2enconf monitor && sudo systemctl reload apache2
Alias /monitor /var/www/monitor/public

<Directory /var/www/monitor/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</Directory>

# El endpoint de ingesta solo acepta conexiones desde el propio servidor (receptores Node).
<Directory /var/www/monitor/public/api>
    <Files "ingest.php">
        Require local
    </Files>
</Directory>

# Si el sitio principal hace de proxy de otra aplicación (ProxyPass /), excluir /monitor.
<IfModule mod_proxy.c>
    ProxyPass /monitor !
</IfModule>
