# VirtualHost de Apache para el monitor.
# Instalar:
#   sudo cp deploy/apache-monitor.conf /etc/apache2/sites-available/monitor.conf
#   (ajustar ServerName y la ruta /var/www/monitor)
#   sudo a2enmod headers rewrite && sudo a2ensite monitor && sudo systemctl reload apache2
#   sudo certbot --apache -d monitor.minkafab.com      # HTTPS (recomendado)
<VirtualHost *:80>
    ServerName monitor.minkafab.com
    DocumentRoot /var/www/monitor/public

    <Directory /var/www/monitor/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # El endpoint de ingesta solo acepta conexiones locales (los receptores Node corren en el servidor).
    <Location /api/ingest.php>
        Require local
    </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/monitor_error.log
    CustomLog ${APACHE_LOG_DIR}/monitor_access.log combined
</VirtualHost>
